name: Repository checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  documents:
    name: Required documents
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check required project documents
        run: bash scripts/check-docs.sh
